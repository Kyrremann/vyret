name: Update weather

on:
  schedule:
    - cron: '0, 4,10,14,18 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'weather.rb'
      - '_data/places.yaml'

env:
  TZ: "Europe/Oslo"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # ratchet:ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run updated
        run: bundle exec ruby weather.rb
      - name: Save weather forecast
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: Retrieved the latest forecasts"
          git push
